<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00d4ff" />
    <meta name="description" content="OPTINET SARLU - Solutions IT, Reseaux & Telecommunications, Cybersecurite, Energie" />
    <title>OPTINET SARLU</title>

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Optionnel : a garder seulement si tu n'utilises pas Tailwind via npm -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->

    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: #ffffff;
        background:
          radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.18), transparent 28%),
          linear-gradient(135deg, #07111f 0%, #0b2745 48%, #102c4e 100%);
      }

      #root {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .welcome {
        width: min(720px, 100%);
        text-align: center;
      }

      .welcome h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 7vw, 4.5rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .welcome p {
        margin: 0 auto;
        max-width: 560px;
        color: rgba(255, 255, 255, 0.82);
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        line-height: 1.6;
      }

      #personal-badge {
        position: fixed;
        bottom: 5px;
        right: 15px;
        display: inline-block;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        padding: 8px 14px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 11px;
        font-weight: 600;
        box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        z-index: 9999;
        border: 1px solid #00d4ff;
      }

      #personal-badge:hover {
        background: linear-gradient(135deg, #0099ff 0%, #00d4ff 100%);
        color: #000;
      }

      #personal-badge .name {
        font-weight: 700;
        font-size: 11px;
      }

      #personal-badge .title {
        font-size: 9px;
        opacity: 0.95;
      }

      #personal-badge .contact {
        font-size: 9px;
        opacity: 0.9;
        margin-top: 2px;
      }
    </style>
</head>

<body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application OPTINET.</noscript>

    <div id="root">
        <main class="welcome">
            <h1>Bienvenue chez OPTINET SARLU</h1>
            <p>Solutions IT, reseaux, telecommunications, cybersecurite et energie pour accompagner vos projets numeriques.</p>
        </main>
    </div>

    <!-- Badge signature OPTINET -->
    <a id="personal-badge"
       href="https://optinettogo.com"
       target="_blank"
       rel="noopener noreferrer">
        <div class="name">© 2026 · OPTINET-SARLU</div>
        <div class="title"></div>
        <div class="contact"></div>
    </a>
</body>
</html>
